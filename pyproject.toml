[project]
name = "atproto-lexicons-tools"
version = "0.0.0"
description = "Tooling that fetches third-party AT Protocol lexicons and builds the atproto-lexicons package"
authors = [
    {name = "Ilya (Marshal)", email = "ilya@marshal.dev"}
]
license = "MIT"
# the tooling needs 3.10+; the package it generates supports 3.9+
requires-python = ">=3.10,<3.16"
readme = "README.md"
dependencies = [
    # exact: the build drives the code generator of the SDK, so its output must not change between runs
    "atproto==0.0.75",
    "httpx>=0.25.0,<0.29.0",
    "dnspython>=2.4.0,<3",
    "typer>=0.29.1,<1",
    "rich>=15,<16",
]

[project.scripts]
lex = "atproto_lexicons_tools.cli:app"
lexicons = "atproto_lexicons_tools.cli:app"

[dependency-groups]
dev = [
    "ruff==0.17.5",
    "pyrefly==1.4.0",
]
test = [
    "pytest>=8.4.2,<9",
    "pytest-asyncio>=1.2.0",
]

[tool.poetry]
requires-poetry = ">=2.3"
# the tooling is never published; the package that is lives in `package/`
packages = [
    { include = "atproto_lexicons_tools", from = "src" },
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyrefly]
preset = "all"
python-version = "3.10"
project-includes = ["src", "tests"]
search-path = ["src", "."]
enabled-ignores = ["pyrefly"]
strict-callable-subtyping = true
strict-partial-subtyping = true

[tool.pyrefly.errors]
explicit-any = "ignore"
implicit-bool = "ignore"
unused-call-result = "ignore"

[tool.ruff]
line-length = 120
target-version = "py310"
# generated code is formatted by the generator under its own rules
extend-exclude = ["package/atproto_lexicons"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # the formatter owns trailing commas
    "CPY001", # no copyright headers; the licence is in LICENSE
    "ANN401", # t.Any in **kwargs
    "D1", # a docstring is written only where there is a why to tell
    "D203", "D413", # we are not using too many blank lines
    "D213", # we are using the first line for summary
    "D406", "D407", # we are using google style docstring
    "S101", # allow asserting; we are using it for type checks
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "PLR2004", "SLF001"]
# Typer declares flags as boolean parameters with defaults
"src/atproto_lexicons_tools/cli.py" = ["FBT001", "FBT002", "FBT003"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
multiline-quotes = "double"
inline-quotes = "single"
